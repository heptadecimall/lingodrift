/* ---------- state ---------- */
function normW(w){w.stages=Array.isArray(w.stages)?w.stages:[];w.rel=Array.isArray(w.rel)?w.rel:[];
  if(!w.stages.length&&(w.m||w.y))w.stages=[[w.y||'','','',w.m||'']];delete w.m;delete w.y;
  w.stages=w.stages.map(function(s){s=s.slice(0,5);while(s.length<5)s.push('');if(s[0]==='—')s[0]='';if(s[1]==='—')s[1]='';if(!s[4])s[4]=w.w||'';
    if(s[0]||s[2]){var d=s[0];if(/^\d{4}-\d{2}-\d{2}$/.test(d)){var t=new Date(d+'T00:00:00');if(!isNaN(t))d=t.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
      s[1]=[d,s[1],s[2]].filter(Boolean).join(', ');s[0]='';s[2]=''}
    return s});
  ['tags','drift','uses','log','note','from','custom'].forEach(function(k){delete w[k]});return w}
function norm(s){s=(s&&typeof s==='object')?s:{};if(!Array.isArray(s.words))s.words=Array.isArray(s.custom)?s.custom:[];
  delete s.custom;delete s.track;s.words=s.words.map(normW);s.updated=s.updated||0;return s}
var S=null;try{var ls=localStorage.getItem(KEY);if(ls)S=norm(JSON.parse(ls))}catch(e){}
if(!S){try{S=norm(JSON.parse(document.getElementById('state').textContent))}catch(e){S=norm(null)}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

function getW(id){for(var i=0;i<S.words.length;i++)if(S.words[i].id===id)return S.words[i];return null}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(q,el){return (el||document).querySelector(q)}
function $$(q,el){return Array.prototype.slice.call((el||document).querySelectorAll(q))}
function plural(n,w){return n+' '+w+(n===1?'':'s')}
function D(h){return String(h).replace(/(drift\w*)/gi,'<em>$1</em>')}
function toast(msg){var t=$('#toast');t.innerHTML=I.check+'<span>'+D(esc(msg))+'</span>';t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},2200)}
function setStatus(){}
function delWord(id){S.words=S.words.filter(function(x){return x.id!==id});S.words.forEach(function(x){x.rel=x.rel.filter(function(r){return r!==id})});save()}

function save(){
  S.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage is full or blocked, export a backup')}
}
/* backup */
function exportBackup(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var d=new Date(),name='lingodrift-backup-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  /* iPhone/iPad: downloads are unreliable (especially from the home screen), so use the share sheet -> Save to Files */
  var ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&window.File&&navigator.canShare){try{var file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:'LingoDrift backup'}).then(function(){toast('Backup exported')}).catch(function(){});return}}catch(e){}}
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);toast('Backup exported');
}
function importBackup(){
  var inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=function(){var f=inp.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{var d=norm(JSON.parse(r.result));if(!Array.isArray(d.words))throw 0;
      var have={};S.words.forEach(function(w){have[w.id]=1});var added=0;
      d.words.forEach(function(w){if(!have[w.id]){S.words.push(w);added++}});
      save();route(true);toast(added?'Imported '+added+' lingo':'Nothing new to import')}catch(e){toast('That file is not a LingoDrift backup')}};
    r.readAsText(f)};
  inp.click();
}

/* ---------- long press + menu ---------- */
var pressFired=false;
function longPress(el,onFire){
  var t=null,sx=0,sy=0;
  function clear(){clearTimeout(t);t=null;el.classList.remove('pressing')}
  el.addEventListener('pointerdown',function(e){if(e.button>0||e.target.closest('.more'))return;pressFired=false;sx=e.clientX;sy=e.clientY;el.classList.add('pressing');
    t=setTimeout(function(){t=null;el.classList.remove('pressing');pressFired=true;if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){};onFire(sx,sy)},480)});
  el.addEventListener('pointermove',function(e){if(t&&(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8))clear()});
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){el.addEventListener(ev,clear)});
  el.addEventListener('contextmenu',function(e){e.preventDefault();clear();onFire(e.clientX,e.clientY)});
}
function closeMenu(){var m=$('.menu'),s=$('.scrim');if(m)m.remove();if(s)s.remove()}
function openMenu(x,y,items){
  closeMenu();
  var scrim=document.createElement('div');scrim.className='scrim';
  scrim.addEventListener('pointerdown',function(e){e.preventDefault();closeMenu()});
  var m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');
  m.innerHTML=items.map(function(it,i){return '<button role="menuitem" data-i="'+i+'" class="'+(it.danger?'del':'')+'">'+it.icon+'<span>'+D(esc(it.label))+'</span></button>'}).join('');
  document.body.appendChild(scrim);document.body.appendChild(m);
  var r=m.getBoundingClientRect();
  m.style.left=Math.max(8,Math.min(x,innerWidth-r.width-8))+'px';
  m.style.top=Math.max(8,Math.min(y,innerHeight-r.height-8))+'px';
  $$('button',m).forEach(function(b){b.onclick=function(){var it=items[+b.getAttribute('data-i')];
    if(it.danger&&!b.classList.contains('arm')){b.classList.add('arm');b.querySelector('span').textContent='Tap again to delete';return}
    closeMenu();it.run()}});
}
window.addEventListener('scroll',closeMenu,{passive:true});

function armDelete(btn,label,run){btn.onclick=function(){if(btn.classList.contains('arm'))run();else{btn.classList.add('arm');btn.querySelector('span').textContent=label}}}

/* name always comes from the current (latest) drift; w.w is only the last-known fallback */
function nameOf(w){for(var i=w.stages.length-1;i>=0;i--)if(w.stages[i][4])return w.stages[i][4];return w.w||'Untitled'}
function syncName(w){w.w=nameOf(w)}
function removeDrift(w,i){
  if(w.stages.length<=1){var n=nameOf(w);delWord(w.id);toast('"'+n+'" deleted');location.hash='list';return}
  w.stages.splice(i,1);syncName(w);save();toast('Drift deleted');viewWord(w.id,true);
}

/* new lingo form */
var ISO=/^\d{4}-\d{2}-\d{2}$/;
function fmtDate(v){if(!v)return '';if(ISO.test(v)){var d=new Date(v+'T00:00:00');if(!isNaN(d))return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}return v}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateField(val){return '<label for="fd">When <small>anything works</small></label><input id="fd" value="'+esc(fmtDate(val||''))+'" placeholder="e.g. last summer, 2019, school days" autocomplete="off">'}
function noteField(v){return '<label for="fn">Note <small>when, where, what happened</small></label><input id="fn" placeholder="e.g. last summer, at school, from a stream" value="'+esc(v||'')+'" autocomplete="off">'}
/* ---------- categories ---------- */
function catOf(w){return (w.cat||'').trim()}
function allCats(){var m={};S.words.forEach(function(w){var c=catOf(w);if(c)m[c.toLowerCase()]=m[c.toLowerCase()]||c});
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return a.toLowerCase()<b.toLowerCase()?-1:1})}
function catHref(c){return '#cat-'+(c?encodeURIComponent(c):'~')}
function curCat(){var h=location.hash.slice(1);if(P.cats!=='on'||h.indexOf('cat-')!==0)return '';var c=decodeURIComponent(h.slice(4));return c==='~'?'':c}
function catField(cur){var cs=allCats(),hit=cs.filter(function(c){return c.toLowerCase()===(cur||'').toLowerCase()})[0];
  return '<label for="fc">Category <small>optional</small></label>'+
    (cs.length?'<div class="pick" id="cpick">'+cs.map(function(c){return '<button type="button" data-v="'+esc(c)+'" class="'+(c===hit?'on':'')+'">'+I.check+'<span>'+esc(c)+'</span></button>'}).join('')+'</div>':'')+
    '<input id="fc" class="'+(cs.length?'catin':'')+'" placeholder="'+(cs.length?'or type a new one':'e.g. gaming, school, family')+'" value="'+(hit?'':esc(cur||''))+'" autocomplete="off">'}
function mountCat(f){var pk=$('#cpick',f),inp=$('#fc',f);if(!pk)return;
  $$('button',pk).forEach(function(b){b.onclick=function(){var on=!b.classList.contains('on');$$('button',pk).forEach(function(x){x.classList.remove('on')});if(on){b.classList.add('on');inp.value=''}}});
  inp.addEventListener('input',function(){if(inp.value.trim())$$('button',pk).forEach(function(x){x.classList.remove('on')})})}
function readCat(f){var v=$('#fc',f).value.trim();if(v){var same=allCats().filter(function(c){return c.toLowerCase()===v.toLowerCase()})[0];return same||v}
  var on=$('#cpick button.on',f);return on?on.getAttribute('data-v'):''}
function catDrawer(w){
  var foot=(catOf(w)?'<button type="button" class="btn ghost" id="cclr">'+I.close+'<span>Remove</span></button>':'')+'<button type="submit" class="btn wide">'+I.check+'<span>Save</span></button>';
  openDrawer('Category',catField(catOf(w)),foot,function(f){mountCat(f);
    var c=$('#cclr',f);if(c)c.onclick=function(){delete w.cat;save();closeDrawer();toast('Category removed');viewWord(w.id,true)};
    f.addEventListener('submit',function(e){e.preventDefault();var v=readCat(f);if(v)w.cat=v;else delete w.cat;save();closeDrawer();toast(v?'Moved to '+v:'Category removed');viewWord(w.id,true)});
  });
}
function rerender(){var h=location.hash.slice(1);
  if(h.indexOf('word-')===0&&getW(h.slice(5)))viewWord(h.slice(5),true);
  else if(h.indexOf('cat-')===0&&P.cats==='on')viewCat(decodeURIComponent(h.slice(4)));
  else viewHome();
  $('#fab').style.display=h.indexOf('word-')===0?'none':''}

function lingoDrawer(defCat){
  var body='<label for="fw">Word <span class="req">*</span></label><input id="fw" autocomplete="off" autocapitalize="off">'+
  '<label for="fm">Meaning</label><input id="fm">'+noteField('')+catField(defCat||'');
  var foot='<button type="submit" class="btn wide">'+I.check+'<span>Create</span></button>';
  openDrawer('New lingo',body,foot,function(f){mountCat(f);
    $('#fw',f).addEventListener('input',function(e){e.target.classList.remove('bad')});
    f.addEventListener('submit',function(e){e.preventDefault();
      var name=$('#fw',f).value.trim();if(!name){$('#fw',f).classList.add('bad');$('#fw',f).focus();return}
      var dupe=S.words.filter(function(o){return nameOf(o).toLowerCase()===name.toLowerCase()})[0];
      if(dupe){$('#fw',f).classList.add('bad');toast('"'+nameOf(dupe)+'" is already in your list');return}
      var id='w-'+Date.now().toString(36);
      var nw=normW({id:id,w:name,rel:[],stages:[['',$('#fn',f).value.trim(),'',$('#fm',f).value.trim(),name]]}),cat=readCat(f);if(cat)nw.cat=cat;
      S.words.push(nw);
      save();closeDrawer();toast('"'+name+'" created');location.hash='word-'+id;
    });
  });
}

/* drift form: [date, note, legacy where, meaning, word] */
function driftDrawer(w,i){
  var n=w.stages.length,isNew=i<0,s=isNew?['','','','',nameOf(w)]:w.stages[i];
  var note=[s[0],s[1],s[2]].filter(Boolean).join(', ');
  var pos='';
  if(isNew&&n){pos='<label for="dpos">Position</label><div class="selwrap"><select id="dpos"><option value="'+n+'" selected>Latest</option>'+w.stages.map(function(st,k){return '<option value="'+k+'">Before '+esc(st[4])+'</option>'}).join('')+'</select>'+I.down+'</div>'}
  var body='<label for="fw">Word <span class="req">*</span></label><input id="fw" value="'+esc(s[4])+'" autocomplete="off" autocapitalize="off">'+
  '<label for="fm">Meaning</label><input id="fm" value="'+esc(s[3])+'">'+noteField(note)+pos;
  var sole=!isNew&&n===1;
  var foot=(!isNew?'<button type="button" class="btn danger" id="ddel">'+I.trash+'<span>Delete</span></button>':'')+'<button type="submit" class="btn wide">'+I.check+'<span>'+(isNew?'Add':'Save')+'</span></button>';
  openDrawer(isNew?'New drift':'Edit drift',body,foot,function(f){
    var d=$('#ddel',f);if(d)armDelete(d,sole?'Deletes lingo':'Tap again',function(){closeDrawer();removeDrift(w,i)});
    $('#fw',f).addEventListener('input',function(e){e.target.classList.remove('bad')});
    f.addEventListener('submit',function(e){e.preventDefault();
      var word=$('#fw',f).value.trim();if(!word){$('#fw',f).classList.add('bad');$('#fw',f).focus();return}
      var v=['',$('#fn',f).value.trim(),'',$('#fm',f).value.trim(),word];
      if(!isNew)w.stages[i]=v;else{var p=$('#dpos',f);w.stages.splice(p?parseInt(p.value,10):n,0,v)}
      syncName(w);save();closeDrawer();toast(!isNew?'Drift updated':'Drift added');viewWord(w.id,true);
    });
  });
}

function viewHome(){
  var W=S.words;
  var head='<header class="hero"><h1>Lingo<em>Drift</em></h1><div class="hr"><span class="tot"><b>'+W.length+'</b> lingo</span><button class="iconbtn" id="settings" aria-label="Settings">'+I.gear+'</button></div></header>';
  if(!W.length){view.innerHTML=head+'<div class="empty"><b>Start your collection</b>Save the words, phrases and inside jokes you use every day, then trace how each one '+D('drifted')+' over time.<br><button class="btn" id="first">'+I.plus+'<span>Add your first lingo</span></button></div>';$('#first').onclick=function(){lingoDrawer()};$('#settings').onclick=settingsDrawer;stickHero();return}
  if(P.cats==='on'){
    var un=W.filter(function(w){return !catOf(w)});
    view.innerHTML=head+'<div class="cgrid">'+allCats().map(function(c){return catCard(c,W.filter(function(w){return catOf(w).toLowerCase()===c.toLowerCase()}))}).join('')+(un.length?catCard('',un,true):'')+'</div>';
  } else view.innerHTML=head+listHTML(W);
  $('#settings').onclick=settingsDrawer;stickHero();
}
function viewCat(key){
  var un=key==='~',W=S.words.filter(function(w){return un?!catOf(w):catOf(w).toLowerCase()===key.toLowerCase()});
  if(!W.length){location.hash='list';return}
  view.innerHTML='<div class="toprow"><a class="back" href="#list">'+I.back+'<span>Categories</span></a><button class="iconbtn" id="settings" aria-label="Settings">'+I.gear+'</button></div>'+
    '<div class="cathead"><h2>'+esc(un?'Uncategorized':catOf(W[0]))+'</h2><span class="tot"><b>'+W.length+'</b> lingo</span></div>'+listHTML(W);
  $('#settings').onclick=settingsDrawer;
}
function stickHero(){var h=$('.hero');if(h)h.classList.toggle('stuck',window.scrollY>4)}
window.addEventListener('scroll',stickHero,{passive:true});
function settingsDrawer(){
  var n=S.words.length;
  function grp(title,keys){return '<div class="setsec"><h4>'+title+'</h4>'+POPT.filter(function(o){return keys.indexOf(o[0])>=0}).map(function(o){
    var icon=['con','end','line'].indexOf(o[0])>=0;
    return '<label>'+o[1]+'</label><div class="pick'+(icon?' ic':'')+'" data-k="'+o[0]+'">'+o[2].map(function(v){return '<button type="button" data-v="'+v[0]+'" class="'+(P[o[0]]===v[0]?'on':'')+'" aria-label="'+v[1]+'" title="'+v[1]+'">'+(icon?optIcon(o[0],v[0]):I.check+'<span>'+v[1]+'</span>')+'</button>'}).join('')+'</div>'}).join('')+'</div>'}
  var body=grp('Appearance',['cats','list','round'])+grp('Flow style',['lay','con','end','line'])+
    '<div class="setsec"><h4>Backup</h4>'+
    '<button type="button" class="setbtn" id="sexp">'+I.dl+'<span>Export backup<small>Save all '+n+' lingo to a JSON file</small></span></button>'+
    '<button type="button" class="setbtn" id="simp">'+I.up+'<span>Import backup<small>Add lingo from a LingoDrift backup file</small></span></button></div>';
  openDrawer('Settings',body,'<button type="button" class="btn wide" data-done>'+I.check+'<span>Done</span></button>',function(f){
    $('[data-done]',f).onclick=closeDrawer;
    var e=$('#sexp',f);if(!n){e.disabled=true;e.style.opacity=.5}else e.onclick=function(){exportBackup()};
    $('#simp',f).onclick=function(){closeDrawer();importBackup()};
    $$('.pick[data-k]',f).forEach(function(g){$$('button',g).forEach(function(b){b.onclick=function(){
      P[g.getAttribute('data-k')]=b.getAttribute('data-v');saveP();
      $$('button',g).forEach(function(x){x.classList.toggle('on',x===b)});
      rerender()}})});
  });
}

/* ---------- flow style prefs ---------- */
var PKEY='lingodrift-prefs-v1',PDEF={cats:'off',list:'cards',round:'off',lay:'zig',con:'elbow',end:'diamond',line:'thin'};
var P=(function(){var o={};try{o=JSON.parse(localStorage.getItem(PKEY))||{}}catch(e){}var r={};for(var k in PDEF)r[k]=o[k]||PDEF[k];return r})();
function saveP(){try{localStorage.setItem(PKEY,JSON.stringify(P))}catch(e){}applyP()}
function applyP(){document.body.classList.toggle('rounded',P.round==='on')}
applyP();
var POPT=[
 ['cats','Group by category',[['off','Off'],['on','On']]],
 ['list','Lingo list',[['cards','Cards'],['compact','Compact']]],
 ['round','Rounded corners',[['off','Off'],['on','On']]],
 ['lay','Layout',[['zig','Zigzag'],['cas','Cascade'],['str','Straight']]],
 ['con','Connector',[['elbow','Elbow'],['round','Rounded'],['curve','Curve'],['line','Straight']]],
 ['end','Connector end',[['diamond','Diamond'],['arrow','Arrow'],['circle','Circle'],['none','None']]],
 ['line','Line weight',[['thin','Thin'],['bold','Bold']]]
];
/* [marginLeft%, width%] for node i (i===n is the add button) */
function geom(i,n,p){p=p||P;var last=i===n-1,ml,w;
  if(p.lay==='str'){ml=0;w=100}
  else if(p.lay==='cas'){ml=Math.min(i,4)*5;w=80}
  else{ml=i%2?20:0;w=80}
  return [ml,w]}
function linkPath(ax,ay,bx,by,p){p=p||P;var my=Math.round((ay+by)/2),dx=bx-ax;
  if(p.con==='line')return 'M'+ax+','+ay+' L'+bx+','+by;
  if(p.con==='curve')return 'M'+ax+','+ay+' C'+ax+','+(my+4)+' '+bx+','+(my-4)+' '+bx+','+by;
  if(p.con==='round'&&Math.abs(dx)>2){var r=Math.min(12,Math.abs(dx)/2,(by-ay)/2),sx=dx>0?1:-1;
    return 'M'+ax+','+ay+' V'+(my-r)+' Q'+ax+','+my+' '+(ax+sx*r)+','+my+' H'+(bx-sx*r)+' Q'+bx+','+my+' '+bx+','+(my+r)+' V'+by}
  return 'M'+ax+','+ay+' V'+my+' H'+bx+' V'+by}
function endAngle(ax,ay,bx,by,p){p=p||P;return p.con==='line'?-Math.atan2(bx-ax,by-ay)*180/Math.PI:0}
function endMark(bx,by,ang,p,op){p=p||P;var st=' class="dot" style="opacity:'+op+'"',c='#2c2a33';
  var t=' transform="rotate('+ang+' '+bx+' '+by+')"';
  if(p.end==='arrow')return '<path'+st+' d="M'+(bx-5)+','+(by-8)+' L'+bx+','+by+' L'+(bx+5)+','+(by-8)+' Z" fill="'+c+'"'+t+'/>';
  if(p.end==='circle')return '<circle'+st+' cx="'+bx+'" cy="'+(by-4)+'" r="4" fill="'+c+'"/>';
  if(p.end==='none')return '<g'+st+'></g>';
  return '<rect'+st+' x="'+(bx-3.5)+'" y="'+(by-7.5)+'" width="7" height="7" fill="'+c+'" transform="rotate(45 '+bx+' '+(by-4)+')"/>'}
function optIcon(k,v){var c='#2c2a33',o='<svg class="o" viewBox="0 0 40 24" aria-hidden="true">',e='</svg>',ln=' fill="none" stroke="'+c+'" stroke-width="2"';
  if(k==='con'){var d={elbow:'M8 3 V12 H32 V21',round:'M8 3 V7 Q8 12 13 12 H27 Q32 12 32 17 V21',curve:'M8 3 C8 14 32 10 32 21',line:'M8 3 L32 21'}[v];return o+'<path d="'+d+'"'+ln+'/>'+e}
  if(k==='end'){var m={diamond:'<rect x="15.5" y="12.5" width="9" height="9" fill="'+c+'" transform="rotate(45 20 17)"/>',arrow:'<path d="M14 12 L20 21 L26 12 Z" fill="'+c+'"/>',circle:'<circle cx="20" cy="16" r="5" fill="'+c+'"/>',none:''}[v];
    return o+'<path d="M20 2 V'+(v==='none'?22:13)+'"'+ln+'/>'+m+e}
  return o+'<path d="M4 12 H36" fill="none" stroke="'+c+'" stroke-width="'+(v==='bold'?4:1.5)+'"/>'+e}

/* ---------- detail ---------- */
function flowHTML(w){
  var n=w.stages.length;
  return '<div class="flow" id="flow"><svg class="lines" aria-hidden="true"></svg>'+w.stages.map(function(s,i){var last=i===n-1;
    var g=geom(i,n);return '<div class="fnode'+(last?' last':'')+'" data-i="'+i+'" style="animation-delay:'+(i*0.2)+'s;margin-left:'+g[0]+'%;width:'+g[1]+'%"><h4><span class="idx">'+(i<9?'0':'')+(i+1)+'</span><span>'+esc(s[4])+'</span></h4>'+(s[3]?'<p class="mn">'+esc(s[3])+'</p>':'')+(s[1]?'<p>'+esc(s[1])+'</p>':'')+(s[2]?'<div class="pl meta">'+I.pin+'<span>'+esc(s[2])+'</span></div>':'')+
    '<button class="iconbtn more" aria-label="Drift options">'+I.more+'</button></div>'}).join('')+
  '<button class="addd" id="addd" style="margin-left:'+geom(n,n)[0]+'%;width:'+geom(n,n)[1]+'%">'+I.plus+'<span>'+D('Add drift')+'</span></button></div>';
}
function drawFlow(animate){
  var flow=$('#flow');if(!flow)return;var svg=flow.querySelector('svg');var ns=$$('.fnode,.addd',flow);
  var p='';
  for(var i=0;i<ns.length-1;i++){var a=ns[i],b=ns[i+1];
    var ax=a.offsetLeft+a.offsetWidth/2,ay=a.offsetTop+a.offsetHeight,bx=b.offsetLeft+b.offsetWidth/2,by=b.offsetTop,my=Math.round((ay+by)/2);
    var dash=b.classList.contains('addd')?' stroke-dasharray="4 5"':'';
    p+='<path class="link'+(P.line==='bold'?' bold':'')+'"'+dash+' d="'+linkPath(ax,ay,bx,by-1)+'"/>'+endMark(bx,by-1,endAngle(ax,ay,bx,by),P,animate&&!dash?0:1)}
  svg.innerHTML=p;
  var dots=$$('.dot',svg);
  $$('path.link',svg).forEach(function(el,i){if(el.getAttribute('stroke-dasharray'))return;var L=el.getTotalLength();el.style.strokeDasharray=L;
    if(animate){el.style.strokeDashoffset=L;el.style.animation='draw .45s '+(0.2+i*0.22)+'s forwards ease-out';
      var d=dots[i];d.style.transition='opacity .2s '+(0.55+i*0.22)+'s';requestAnimationFrame(function(){requestAnimationFrame(function(){d.style.opacity=1})})}});
}
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){drawFlow(false)},120)});

function spanOf(w){var d=w.stages.map(function(s){return ISO.test(s[0])?new Date(s[0]+'T00:00:00').getTime():(/\b\d{4}\b/.test(s[0])?Date.parse(s[0]):NaN)}).filter(function(t){return !isNaN(t)});
  if(d.length<2)return '';var days=Math.round((Math.max.apply(null,d)-Math.min.apply(null,d))/864e5);
  if(days<1)return 'all on one day';if(days<31)return 'over '+plural(days,'day');if(days<365)return 'over '+plural(Math.round(days/30.4),'month');
  var y=Math.round(days/36.5)/10;return 'over '+y+' year'+(y===1?'':'s')}
function nowOf(w){for(var i=w.stages.length-1;i>=0;i--)if(w.stages[i][0])return w.stages[i][0];return ''}
function insightHTML(w){
  var n=w.stages.length,a=firstForm(w)||nameOf(w),b=nameOf(w),span=spanOf(w),since=sinceOf(w),m0=w.stages[0][3],m1=curMeaning(w);
  var top=(n>1&&a.toLowerCase()!==b.toLowerCase())
    ?'<div class="ft"><div><div class="meta">started as</div><b>'+esc(a)+'</b></div>'+I.arrow+'<div class="to"><div class="meta">now</div><b>'+esc(b)+'</b></div></div>'
    :'<div class="same">'+(n>1?'Still <b>'+esc(b)+'</b>, but its meaning '+D('drifted')+'.':'Started as <b>'+esc(b)+'</b>, no '+D('drift')+' yet.')+'</div>';
  var st=['<span>'+I.drift+'<span>'+D(plural(n,'drift'))+'</span></span>'];
  st.push(catOf(w)?'<button class="catb" id="catb">'+I.folder+'<span>'+esc(catOf(w))+'</span></button>':'<button class="catb add" id="catb">'+I.plus+'<span>Category</span></button>');
  return '<div class="insight">'+top+'<div class="st meta">'+st.join('')+'</div></div>';
}
function viewWord(id,keep){
  var w=getW(id);if(!w){location.hash='list';return}
  var since=sinceOf(w);
  var m=curMeaning(w),ff=firstForm(w),bits=[];if(since)bits.push('Since '+esc(fmtDate(since)));if(ff&&ff.toLowerCase()!==nameOf(w).toLowerCase())bits.push('started as <b>'+esc(ff)+'</b>');bits.push(D(plural(w.stages.length,'drift')));
  var bk=P.cats==='on'?'<a class="back" href="'+catHref(catOf(w))+'">'+I.back+'<span>'+esc(catOf(w)||'Uncategorized')+'</span></a>':'<a class="back" href="#list">'+I.back+'<span>All lingo</span></a>';
  view.innerHTML='<div class="toprow">'+bk+'<button class="iconbtn" id="settings" aria-label="Settings">'+I.gear+'</button></div>'+
  '<section>'+(w.stages.length?insightHTML(w)+flowHTML(w):'<div class="empty"><b>No meaning yet</b>Add what it means, where it came from and when.<br><button class="btn" id="addfirst">'+I.plus+'<span>Add first '+D('drift')+'</span></button></div>')+'</section>';
  $('#settings').onclick=settingsDrawer;
  var cb=$('#catb');if(cb)cb.onclick=function(){catDrawer(w)};
  var ad=$('#addd')||$('#addfirst');if(ad)ad.onclick=function(){driftDrawer(w,-1)};
  requestAnimationFrame(function(){drawFlow(!keep)});
  $$('.fnode').forEach(function(n){var i=+n.getAttribute('data-i');
    function menu(x,y){openMenu(x,y,[{label:'Edit drift',icon:I.pencil,run:function(){driftDrawer(w,i)}},{label:(w.stages.length===1?'Delete lingo':'Delete drift'),icon:I.trash,danger:true,run:function(){removeDrift(w,i)}}])}
    longPress(n,menu);
    $('.more',n).onclick=function(e){var r=e.currentTarget.getBoundingClientRect();menu(r.right-190,r.bottom+4)};
  });
}

route(true);
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script></body></html>
